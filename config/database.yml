default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "password" } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>

development:
  <<: *default
  database: checqin_development

test:
  <<: *default
  database: checqin_test

production:
  <<: *default
  database: checqin_production
  username: checqin
  password: <%= ENV["CHECQIN_DATABASE_PASSWORD"] %>
